<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghana Data Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #ffd400;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 500px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .network-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .network {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .mtn {
      background: #ffd400;
      color: #111;
    }

    .telecel {
      background: #e30613;
      color: white;
    }

    .selected-network {
      outline: 4px solid #111;
    }

    .bundles {
      display: grid;
      gap: 12px;
    }

    .bundle {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      background: white;
      transition: 0.2s;
    }

    .bundle:hover {
      border-color: #111;
    }

    .bundle.selected {
      border-color: #111;
      background: #f1f1f1;
    }

    .bundle-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data {
      font-size: 19px;
      font-weight: bold;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
    }

    .validity {
      margin-top: 7px;
      color: #666;
      font-size: 14px;
    }

    .continue {
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue:active {
      transform: scale(0.98);
    }

    .message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #eef7ee;
      color: #176b17;
      display: none;
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: 12px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  🇬🇭 Ghana Data Shop
</header>

<div class="container">

  <!-- PHONE -->
  <div class="card">
    <h2>1. Enter Phone Number</h2>

    <label for="phone">Ghana Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="e.g. 0241234567"
      maxlength="10"
    >
  </div>


  <!-- NETWORK -->
  <div class="card">
    <h2>2. Select Network</h2>

    <div class="network-buttons">

      <button
        class="network mtn selected-network"
        id="mtnBtn"
        onclick="selectNetwork('MTN')"
      >
        MTN
      </button>

      <button
        class="network telecel"
        id="telecelBtn"
        onclick="selectNetwork('Telecel')"
      >
        Telecel
      </button>

    </div>
  </div>


  <!-- BUNDLES -->
  <div class="card">

    <h2>3. Choose Data Bundle</h2>

    <div class="bundles" id="bundleList"></div>

    <div class="note">
      Bundle availability and eligibility can vary by network and customer.
      The payment and automatic data delivery system will be connected separately.
    </div>

  </div>


  <!-- PAYMENT -->
  <div class="card">

    <h2>4. Order</h2>

    <button class="continue" onclick="continueOrder()">
      Continue to Payment
    </button>

    <div class="message" id="message"></div>

  </div>

</div>

<footer>
  © 2026 Ghana Data Shop
</footer>


<script>

  let selectedNetwork = "MTN";
  let selectedBundle = null;


  /*
    MTN OFFICIAL DATA ZONE EXAMPLES

    These are eligibility-based offers.
    They are not guaranteed to be available to every MTN number.
  */

  const mtnBundles = [

    {
      data: "327.25 MB",
      price: 2.99,
      validity: "1 Day"
    },

    {
      data: "495.40 MB",
      price: 3.99,
      validity: "1 Day"
    },

    {
      data: "806.45 MB",
      price: 5.99,
      validity: "1 Day"
    }

  ];


  /*
    TELECEL OFFICIAL OFFER EXAMPLES
  */

  const telecelBundles = [

    {
      data: "501.4 MB",
      price: 2.50,
      validity: "24 Hours"
    },

    {
      data: "891.4 MB",
      price: 3.50,
      validity: "24 Hours"
    },

    {
      data: "1.45 GB",
      price: 4.50,
      validity: "24 Hours"
    },

    {
      data: "770 MB",
      price: 5.00,
      validity: "3 Days"
    },

    {
      data: "990 MB",
      price: 10.00,
      validity: "15 Days"
    },

    {
      data: "2.53 GB",
      price: 20.00,
      validity: "5 Days"
    }

  ];


  function selectNetwork(network) {

    selectedNetwork = network;
    selectedBundle = null;

    document
      .getElementById("mtnBtn")
      .classList.remove("selected-network");

    document
      .getElementById("telecelBtn")
      .classList.remove("selected-network");

    if (network === "MTN") {

      document
        .getElementById("mtnBtn")
        .classList.add("selected-network");

    } else {

      document
        .getElementById("telecelBtn")
        .classList.add("selected-network");

    }

    displayBundles();
  }


  function displayBundles() {

    const list = document.getElementById("bundleList");

    list.innerHTML = "";

    const bundles =
      selectedNetwork === "MTN"
      ? mtnBundles
      : telecelBundles;


    bundles.forEach((bundle, index) => {

      const div = document.createElement("div");

      div.className = "bundle";

      div.innerHTML = `

        <div class="bundle-top">

          <div class="data">
            ${bundle.data}
          </div>

          <div class="price">
            GH₵${bundle.price.toFixed(2)}
          </div>

        </div>

        <div class="validity">
          Validity: ${bundle.validity}
        </div>

      `;


      div.onclick = function() {

        document
          .querySelectorAll(".bundle")
          .forEach(item => {
            item.classList.remove("selected");
          });

        div.classList.add("selected");

        selectedBundle = bundle;

      };


      list.appendChild(div);

    });

  }


  function continueOrder() {

    const phone =
      document.getElementById("phone").value.trim();

    const message =
      document.getElementById("message");


    if (phone.length < 10) {

      message.style.display = "block";

      message.style.background = "#ffecec";

      message.style.color = "#b00000";

      message.innerText =
        "Please enter a valid Ghana phone number.";

      return;
    }


    if (!selectedBundle) {

      message.style.display = "block";

      message.style.background = "#ffecec";

      message.style.color = "#b00000";

      message.innerText =
        "Please select a data bundle.";

      return;
    }


    message.style.display = "block";

    message.style.background = "#eef7ee";

    message.style.color = "#176b17";

    message.innerText =
      "Selected " +
      selectedNetwork +
      " " +
      selectedBundle.data +
      " for GH₵" +
      selectedBundle.price.toFixed(2) +
      ". Payment connection will be added next.";

  }


  // Load MTN bundles when the site opens
  displayBundles();

</script>

</body>
</html>
